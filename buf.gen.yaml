version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/openagx/aagfe/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  # TypeScript for api-gateway
  - remote: buf.build/protocolbuffers/gogotiny
    out: gen/ts
    opt: paths=source_relative
