name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0-rc.1)"
        required: true
        type: string

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.8"
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: buf lint
      - run: buf generate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @caas/api-gateway test
      - name: Build all go services
        run: |
          for svc in services/*/; do
            if [ -f "$svc/go.mod" ]; then
              (cd "$svc" && go test ./... && go build ./...) || exit 1
            fi
          done

  publish-metadata:
    name: Publish release metadata
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - name: Emit release manifest
        run: |
          mkdir -p artifacts
          cat <<MANIFEST > artifacts/release-manifest.txt
          version=${{ inputs.version }}
          commit=${{ github.sha }}
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MANIFEST
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release-manifest.txt
