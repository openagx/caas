services:
  # --- Data Stores ---

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caas
      POSTGRES_PASSWORD: caas_dev
      POSTGRES_DB: caas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/caas_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p caas_dev_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Authorization ---

  spicedb-migrate:
    image: authzed/spicedb:latest
    command: migrate head
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: "postgres://caas:caas_dev@postgres:5432/spicedb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  spicedb:
    image: authzed/spicedb:latest
    command: serve
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: caas_dev_key
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: "postgres://caas:caas_dev@postgres:5432/spicedb?sslmode=disable"
      SPICEDB_HTTP_ENABLED: "true"
    ports:
      - "50051:50051"  # gRPC
      - "8443:8443"    # HTTP/REST
      - "9090:9090"    # Metrics
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- Event Streaming ---

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"  # Kafka API
      - "18082:18082"  # Pandaproxy (REST)
      - "9644:9644"    # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # --- Application Services ---

  authz-engine:
    build:
      context: .
      dockerfile: infra/docker/authz-engine.Dockerfile
    ports:
      - "50051:50051"
    environment:
      AUTHZ_PORT: "50051"
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_PRESHARED_KEY: caas_dev_key
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      spicedb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - app

  entity-service:
    build:
      context: .
      dockerfile: infra/docker/entity-service.Dockerfile
    ports:
      - "50052:50052"
    environment:
      ENTITY_PORT: "50052"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - app

  trust-engine:
    build:
      context: .
      dockerfile: infra/docker/trust-engine.Dockerfile
    ports:
      - "50053:50053"
    environment:
      TRUST_PORT: "50053"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: caas_dev_password
      KAFKA_BROKERS: redpanda:9092
      ML_SIDECAR_URL: http://ml-sidecar:8090
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      ml-sidecar:
        condition: service_started
    profiles:
      - app

  ml-sidecar:
    build:
      context: .
      dockerfile: infra/docker/ml-sidecar.Dockerfile
    ports:
      - "8090:8090"
    environment:
      ML_SIDECAR_PORT: "8090"
    profiles:
      - app

  fraud-pipeline:
    build:
      context: .
      dockerfile: infra/docker/fraud-pipeline.Dockerfile
    ports:
      - "50054:50054"
    environment:
      FRAUD_PORT: "50054"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      KAFKA_BROKERS: redpanda:9092
      AUTHZ_ENDPOINT: authz-engine:50051
      ENTITY_ENDPOINT: entity-service:50052
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - app

  decision-service:
    build:
      context: .
      dockerfile: infra/docker/decision-service.Dockerfile
    ports:
      - "50055:50055"
    environment:
      DECISION_PORT: "50055"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - app

  federation-service:
    build:
      context: .
      dockerfile: infra/docker/federation-service.Dockerfile
    ports:
      - "50056:50056"
    environment:
      FEDERATION_PORT: "50056"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      KAFKA_BROKERS: redpanda:9092
      DID_ENDPOINT: did-service:50058
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      did-service:
        condition: service_started
    profiles:
      - app

  surplus-engine:
    build:
      context: .
      dockerfile: infra/docker/surplus-engine.Dockerfile
    ports:
      - "50057:50057"
    environment:
      SURPLUS_PORT: "50057"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - app

  did-service:
    build:
      context: .
      dockerfile: infra/docker/did-service.Dockerfile
    ports:
      - "50058:50058"
    environment:
      DID_PORT: "50058"
      DATABASE_URL: postgres://caas:caas_dev@postgres:5432/caas
      KAFKA_BROKERS: redpanda:9092
      DID_KEY_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      DID_DOMAIN: "caas.local"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - app

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/api-gateway.Dockerfile
    ports:
      - "3001:3001"
    environment:
      API_PORT: "3001"
      ENTITY_ENDPOINT: entity-service:50052
      AUTHZ_ENDPOINT: authz-engine:50051
      TRUST_ENDPOINT: trust-engine:50053
      FRAUD_URL: http://fraud-pipeline:50054
      DECISION_ENDPOINT: decision-service:50055
      FEDERATION_ENDPOINT: federation-service:50056
      SURPLUS_ENDPOINT: surplus-engine:50057
      DID_ENDPOINT: did-service:50058
    depends_on:
      - authz-engine
      - entity-service
      - trust-engine
      - fraud-pipeline
      - decision-service
      - federation-service
      - surplus-engine
      - did-service
    profiles:
      - app

volumes:
  postgres_data:
  neo4j_data:
  redpanda_data:
